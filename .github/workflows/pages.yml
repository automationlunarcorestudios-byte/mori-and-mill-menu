# Publishes the flipbook to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Browsers keep flipbook.js/css for ~10 minutes; stamping the commit into their URLs
      # makes every deploy load the matching copy instead of a stale one.
      - name: Stamp asset versions
        run: |
          find . -name index.html -not -path './.git/*' -exec sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" {} +   # flipbook.js/css and decor.js
          sed -i "s#'pages/pages.js'#'pages/pages.js?v=${GITHUB_SHA::7}'#" flipbook.js
          find . -path '*/pages/pages.js' -exec sed -i "s/\.jpg\"/.jpg?v=${GITHUB_SHA::7}\"/g" {} +
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
